<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<title>Scheda Palestra – Novembre</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap');
  :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#2a2a2a;--accent:#e8ff47;--accent2:#ff6b35;--text:#f0f0f0;--muted:#666;--done:#2a3a1a;--done-border:#5a8a2a}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;padding-bottom:150px}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 12px;position:sticky;top:0;z-index:100}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}
  .date-badge{font-size:12px;color:var(--muted);font-weight:300;letter-spacing:1px}
  .tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex-shrink:0;padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s}
  .tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
  .tab.abs-tab{border-color:#ff6b35;color:#ff6b35}
  .tab.abs-tab.active{background:var(--accent2);color:#000;border-color:var(--accent2)}
  .content{padding:16px 16px 0}
  .section-label{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:28px;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px;line-height:1}
  .section-sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:18px}
  .exercise-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
  .exercise-card.completed{background:var(--done);border-color:var(--done-border)}
  .exercise-header{display:flex;align-items:center;padding:12px 14px;gap:12px;cursor:pointer;user-select:none}
  .ex-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:22px;color:var(--accent);min-width:28px;line-height:1}
  .ex-info{flex:1}
  .ex-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.5px;line-height:1.3;margin-bottom:3px}
  .ex-scheme{font-size:12px;color:var(--muted);font-weight:300}
  .ex-toggle{font-size:18px;color:var(--muted);transition:transform .2s}
  .ex-toggle.open{transform:rotate(180deg)}
  .sets-panel{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
  .sets-panel.open{display:block}
  .sets-panel-inner{padding-top:12px}
  .set-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .set-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;color:var(--muted);min-width:42px;letter-spacing:1px}
  .set-input-wrap{display:flex;align-items:center;gap:6px;flex:1}
  .set-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;text-align:center;padding:8px 6px;width:72px;-webkit-appearance:none;outline:none}
  .set-input:focus{border-color:var(--accent)}
  .set-unit{font-size:12px;color:var(--muted);min-width:20px}
  .set-done-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;color:var(--muted);flex-shrink:0}
  .set-done-btn.done{background:var(--done-border);border-color:var(--done-border);color:#fff}
  .rep-target{font-size:12px;color:var(--muted);min-width:44px;text-align:right}
  .ex-notes{font-size:12px;color:#888;background:var(--surface2);border-radius:6px;padding:8px 10px;margin-top:8px;line-height:1.5;border-left:2px solid var(--accent)}
  .abs-card{background:var(--surface);border:1px solid #ff6b3533;border-radius:10px;padding:14px;margin-bottom:10px}
  .abs-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:15px;color:var(--accent2);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
  .abs-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
  .abs-row:last-child{border-bottom:none}
  .abs-ex-name{font-size:14px;font-weight:500}
  .abs-reps{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:var(--accent2)}
  .abs-counter{display:flex;align-items:center;gap:8px;margin-top:12px}
  .round-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;padding:10px 16px;cursor:pointer;letter-spacing:1px;flex:1;text-align:center}
  .round-btn.primary{background:var(--accent2);color:#000;border-color:var(--accent2)}
  .progress-bar-wrap{background:var(--surface2);border-radius:4px;height:4px;margin:12px 0 0;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
  .tab-content{display:none}
  .tab-content.active{display:block}
  .save-banner{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#000;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:2px;padding:10px 24px;border-radius:100px;transition:transform .3s;z-index:200;white-space:nowrap}
  .save-banner.show{transform:translateX(-50%) translateY(0)}
  .timer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:150;display:flex;align-items:center;gap:10px}
  .timer.running{border-top-color:var(--accent)}
  .timer.finished{background:var(--accent);border-top-color:var(--accent)}
  .timer.finished .t-time,.timer.finished .t-label{color:#000}
  .t-main{flex:1;min-width:0}
  .t-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .t-time{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:34px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
  .timer.running .t-time{color:var(--accent)}
  .t-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;padding:10px 12px;cursor:pointer;letter-spacing:1px;min-width:44px;text-align:center}
  .t-btn.go{background:var(--accent);color:#000;border-color:var(--accent)}
  .t-presets{display:flex;gap:6px;margin-top:6px}
  .t-chip{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;padding:4px 9px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .t-chip.sel{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo">💪 Vito · Novembre</div>
    <div class="date-badge" id="dateLabel"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('A')">A — Petto/Spalle/Bicipiti</button>
    <button class="tab" onclick="switchTab('B')">B — Dorsali/Femorali/Polpacci</button>
    <button class="tab" onclick="switchTab('C')">C — Tricipiti/Quadricipiti</button>
    <button class="tab abs-tab" onclick="switchTab('ABS')">ABS</button>
  </div>
</div>

<div class="content">

<div class="tab-content active" id="tab-A">
  <div class="section-label" style="color: var(--accent)">Petto</div>
  <div class="section-sub">+ Spalle + Bicipiti</div>
  <div id="exercises-A"></div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-A" style="width:0%"></div></div>
</div>

<div class="tab-content" id="tab-B">
  <div class="section-label" style="color: #38bdf8">Dorsali</div>
  <div class="section-sub">+ Femorali + Polpacci</div>
  <div id="exercises-B"></div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-B" style="width:0%; background: #38bdf8"></div></div>
</div>

<div class="tab-content" id="tab-C">
  <div class="section-label" style="color: #a78bfa">Tricipiti</div>
  <div class="section-sub">+ Quadricipiti</div>
  <div id="exercises-C"></div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-C" style="width:0%; background: #a78bfa"></div></div>
</div>

<div class="tab-content" id="tab-ABS">
  <div class="section-label" style="color: var(--accent2)">Addominali</div>
  <div class="section-sub">Tri-set × 4 round</div>
  <div class="abs-card">
    <div class="abs-title">🔥 Tri-Set</div>
    <div class="abs-row"><span class="abs-ex-name">Leg raise alle parallele</span><span class="abs-reps">× 15</span></div>
    <div class="abs-row"><span class="abs-ex-name">Abdominal machine</span><span class="abs-reps">× 15</span></div>
    <div class="abs-row"><span class="abs-ex-name">Torsioni con bastone seduto</span><span class="abs-reps">× 100</span></div>
    <div class="abs-counter" style="margin-top:16px; align-items:center; justify-content:space-between">
      <button class="round-btn" onclick="absRound(-1)" style="flex:0 0 44px; padding:10px 0">−</button>
      <div style="text-align:center">
        <div id="absRoundNum" style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:48px;color:var(--accent2);line-height:1">0</div>
        <div style="font-size:12px;color:var(--muted);letter-spacing:2px">/ 4 ROUND</div>
      </div>
      <button class="round-btn primary" onclick="absRound(1)" style="flex:0 0 44px; padding:10px 0">＋</button>
    </div>
    <button class="round-btn" style="margin-top:10px;width:100%" onclick="resetAbs()">Reset</button>
  </div>
</div>

</div>

<div class="timer" id="timer">
  <div class="t-main">
    <div class="t-label" id="tLabel">Pausa</div>
    <div class="t-time" id="tTime">1:30</div>
    <div class="t-presets" id="tPresets"></div>
  </div>
  <button class="t-btn" onclick="timerAdd(-15)">−15</button>
  <button class="t-btn" onclick="timerAdd(15)">+15</button>
  <button class="t-btn go" id="tGo" onclick="timerToggle()">▶</button>
</div>

<div class="save-banner" id="saveBanner">✓ SALVATO</div>

<script>
const ABS_TOTAL_ROUNDS = 4;
const PFX = 'v3_'; // nuovo prefisso: i dati della scheda precedente non si mescolano

const SCHEMA = {
  A: [
    { name: "Pec fly", sets: 3, reps: ["15/12","15/12","15/12"] },
    { name: "Distensioni bilanciere panca piana", sets: 5, reps: [6,8,8,10,12] },
    { name: "Distensioni smith machine panca 40°", sets: 4, reps: [8,8,10,12] },
    { name: "Dip + pullover 1 manubrio", sets: 4, reps: [10,10,10,10] },
    { name: "Alzate laterali in piedi", sets: 3, reps: [6,6,6] },
    { name: "Tirate al petto bilanciere", sets: 3, reps: [12,12,12] },
    { name: "Curl alternato in piedi", sets: 4, reps: [6,8,10,15] },
    { name: "Curl panca 45° ai cavi bassi", sets: 4, reps: ["10/8","10/8","10/8","10/8"] },
  ],
  B: [
    { name: "Lat machine presa inversa", sets: 4, reps: [12,12,12,12] },
    { name: "Rematore bilanciere EZ presa inversa", sets: 4, reps: [6,8,10,15] },
    { name: "T-bar presa larga", sets: 5, reps: ["10/8","10/8","10/8","10/8","10/8"] },
    { name: "Row hammer presa neutra", sets: 3, reps: [12,12,12] },
    { name: "Leg curl", sets: 5, reps: [15,12,10,10,10] },
    { name: "Standing leg curl", sets: 4, reps: [8,8,8,8], note: "No stop" },
    { name: "Calf in piedi", sets: 3, reps: [15,20,25] },
  ],
  C: [
    { name: "Push down 1 maniglia presa inversa", sets: 3, reps: [10,12,15] },
    { name: "French press bilanciere EZ panca 45°", sets: 5, reps: [8,8,8,10,12] },
    { name: "Leg extension", sets: 4, reps: [12,12,12,12] },
    { name: "Pendulum", sets: 4, reps: [10,10,8,15] },
    { name: "V-squat", sets: 3, reps: [10,10,10] },
    { name: "Belt squat", sets: 3, reps: [8,10,10] },
    { name: "Affondi bulgari", sets: 3, reps: [12,12,12] },
  ]
};

function loadWeights(day, exIdx, setIdx) {
  try { return localStorage.getItem(`${PFX}w_${day}_${exIdx}_${setIdx}`) || ''; } catch(e) { return ''; }
}
function saveWeight(day, exIdx, setIdx, val) {
  try { localStorage.setItem(`${PFX}w_${day}_${exIdx}_${setIdx}`, val); showSaved(); } catch(e) {}
}
function loadDone(day, exIdx, setIdx) {
  try { return localStorage.getItem(`${PFX}d_${day}_${exIdx}_${setIdx}`) === '1'; } catch(e) { return false; }
}
function saveDone(day, exIdx, setIdx, val) {
  try { localStorage.setItem(`${PFX}d_${day}_${exIdx}_${setIdx}`, val ? '1' : '0'); } catch(e) {}
}

let saveTimer;
function showSaved() {
  const b = document.getElementById('saveBanner');
  b.classList.add('show');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => b.classList.remove('show'), 1500);
}

function buildExercises(day) {
  const container = document.getElementById(`exercises-${day}`);
  if (!container) return;
  container.innerHTML = '';

  SCHEMA[day].forEach((ex, exIdx) => {
    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.id = `card-${day}-${exIdx}`;

    const header = document.createElement('div');
    header.className = 'exercise-header';
    header.innerHTML = `
      <div class="ex-num">${exIdx+1}</div>
      <div class="ex-info">
        <div class="ex-name">${ex.name}</div>
        <div class="ex-scheme">${ex.sets} serie · Rep: ${ex.reps.join(' / ')}</div>
      </div>
      <div class="ex-toggle" id="tog-${day}-${exIdx}">▾</div>
    `;
    header.onclick = () => togglePanel(day, exIdx);

    const panel = document.createElement('div');
    panel.className = 'sets-panel';
    panel.id = `panel-${day}-${exIdx}`;
    const inner = document.createElement('div');
    inner.className = 'sets-panel-inner';

    for (let s = 0; s < ex.sets; s++) {
      const row = document.createElement('div');
      row.className = 'set-row';
      const isDone = loadDone(day, exIdx, s);
      const w = loadWeights(day, exIdx, s);
      row.innerHTML = `
        <div class="set-label">SET ${s+1}</div>
        <div class="set-input-wrap">
          <input class="set-input" type="number" inputmode="decimal" placeholder="—" value="${w}"
            onchange="saveWeight('${day}',${exIdx},${s},this.value)"
            oninput="saveWeight('${day}',${exIdx},${s},this.value)">
          <span class="set-unit">kg</span>
        </div>
        <span class="rep-target">${ex.reps[s] || ex.reps[0]} rep</span>
        <button class="set-done-btn ${isDone?'done':''}" id="btn-${day}-${exIdx}-${s}" onclick="toggleDone('${day}',${exIdx},${s})">${isDone ? '✓' : '○'}</button>
      `;
      inner.appendChild(row);
    }

    if (ex.note) {
      const note = document.createElement('div');
      note.className = 'ex-notes';
      note.textContent = '📌 ' + ex.note;
      inner.appendChild(note);
    }

    panel.appendChild(inner);
    card.appendChild(header);
    card.appendChild(panel);
    container.appendChild(card);
    updateCardDone(day, exIdx);
  });
}

function togglePanel(day, exIdx) {
  const panel = document.getElementById(`panel-${day}-${exIdx}`);
  const tog = document.getElementById(`tog-${day}-${exIdx}`);
  const open = panel.classList.toggle('open');
  tog.classList.toggle('open', open);
}

function toggleDone(day, exIdx, setIdx) {
  const btn = document.getElementById(`btn-${day}-${exIdx}-${setIdx}`);
  const isDone = !btn.classList.contains('done');
  btn.classList.toggle('done', isDone);
  btn.textContent = isDone ? '✓' : '○';
  saveDone(day, exIdx, setIdx, isDone);
  if (isDone) timerStart();
  updateCardDone(day, exIdx);
  updateProgress(day);
}

function updateCardDone(day, exIdx) {
  const ex = SCHEMA[day][exIdx];
  const card = document.getElementById(`card-${day}-${exIdx}`);
  let allDone = true;
  for (let s = 0; s < ex.sets; s++) {
    if (!loadDone(day, exIdx, s)) { allDone = false; break; }
  }
  card.classList.toggle('completed', allDone);
}

function updateProgress(day) {
  let total = 0, done = 0;
  SCHEMA[day].forEach((ex, exIdx) => {
    for (let s = 0; s < ex.sets; s++) { total++; if (loadDone(day, exIdx, s)) done++; }
  });
  const pct = total ? Math.round(done/total*100) : 0;
  const bar = document.getElementById(`progress-${day}`);
  if (bar) bar.style.width = pct + '%';
}

function switchTab(day) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${day}`).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => {
    if (t.getAttribute('onclick') === `switchTab('${day}')`) t.classList.add('active');
  });
}

let absRounds = 0;
function absRound(d) {
  absRounds = Math.max(0, Math.min(ABS_TOTAL_ROUNDS, absRounds + d));
  document.getElementById('absRoundNum').textContent = absRounds;
  try { localStorage.setItem(PFX + 'abs_rounds', absRounds); } catch(e){}
}
function resetAbs() {
  absRounds = 0;
  document.getElementById('absRoundNum').textContent = 0;
  try { localStorage.removeItem(PFX + 'abs_rounds'); } catch(e){}
}

document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('it-IT', {weekday:'short', day:'numeric', month:'short'}).toUpperCase();

['A','B','C'].forEach(day => { buildExercises(day); updateProgress(day); });

try { absRounds = parseInt(localStorage.getItem(PFX + 'abs_rounds')) || 0; } catch(e){}
document.getElementById('absRoundNum').textContent = absRounds;

// ---------- TIMER PAUSE ----------
const PRESETS = [60, 90, 120, 180];
let restDur = 90, tEnd = 0, tInt = null, tRemain = 90, audioCtx = null;
try { restDur = parseInt(localStorage.getItem(PFX + 'rest')) || 90; } catch(e){}
tRemain = restDur;

function fmt(sec) { sec = Math.max(0, sec); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); }

function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.3, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.2);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
    });
  } catch(e) {}
  try { navigator.vibrate && navigator.vibrate([200,100,200,100,200]); } catch(e) {}
}

function renderTimer() {
  const el = document.getElementById('timer');
  const running = !!tInt;
  document.getElementById('tTime').textContent = fmt(tRemain);
  document.getElementById('tGo').textContent = running ? '■' : '▶';
  el.classList.toggle('running', running);
  document.querySelectorAll('.t-chip').forEach(c => c.classList.toggle('sel', +c.dataset.s === restDur));
}

function tick() {
  tRemain = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  if (tRemain <= 0) {
    clearInterval(tInt); tInt = null;
    const el = document.getElementById('timer');
    document.getElementById('tLabel').textContent = 'Pausa finita — via!';
    el.classList.add('finished');
    beep();
    setTimeout(() => { el.classList.remove('finished'); document.getElementById('tLabel').textContent = 'Pausa'; tRemain = restDur; renderTimer(); }, 4000);
  }
  renderTimer();
}

function timerStart(sec) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume && audioCtx.resume(); } catch(e) {}
  clearInterval(tInt);
  document.getElementById('timer').classList.remove('finished');
  document.getElementById('tLabel').textContent = 'Pausa';
  tEnd = Date.now() + (sec ?? restDur) * 1000;
  tInt = setInterval(tick, 250);
  tick();
}
function timerStop() { clearInterval(tInt); tInt = null; tRemain = restDur; renderTimer(); }
function timerToggle() { tInt ? timerStop() : timerStart(tRemain); }
function timerAdd(d) {
  if (tInt) { tEnd += d * 1000; tick(); }
  else { tRemain = Math.max(5, tRemain + d); renderTimer(); }
}
function setRest(s) {
  restDur = s;
  try { localStorage.setItem(PFX + 'rest', s); } catch(e) {}
  if (tInt) timerStart(s); else { tRemain = s; renderTimer(); }
}

const presetsEl = document.getElementById('tPresets');
PRESETS.forEach(s => {
  const b = document.createElement('button');
  b.className = 't-chip'; b.dataset.s = s;
  b.textContent = s >= 60 ? (s/60 === Math.floor(s/60) ? s/60 + "'" : Math.floor(s/60) + "'" + (s%60)) : s + '"';
  b.onclick = () => setRest(s);
  presetsEl.appendChild(b);
});
renderTimer();
</script>
</body>
</html>
